         x="45.373047"
         y="188.21053"
         id="tspan342">He laughed aloud in a joyful cheer,
</tspan><tspan
         x="45.373047"
         y="201.66765"
         id="tspan344">Then roared out a flame, bold and clear.
</tspan><tspan
         x="45.373047"
         y="215.12477"
         id="tspan346">But startled himself with the heat and the roar,
</tspan><tspan
         x="45.373047"
         y="228.5819"
         id="tspan348">And stumbled back, shaken to the core.</tspan></text><text
       xml:space="preserve"
       transform="matrix(0.63544798,0,0,0.63544798,-19.072716,102.47134)"
       id="text954-0"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:10.7657px;font-family:Tuffy;-inkscape-font-specification:'Tuffy, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;white-space:pre;shape-inside:url(#rect956-9);display:inline;fill:#ffffff;stroke:none"><tspan
         x="45.373047"
         y="188.21053"
         id="tspan350">He tried with care, a hesitant blow —
</tspan><tspan
         x="45.373047"
         y="201.66765"
         id="tspan352">Just a puff of smoke, a feeble flow.
</tspan><tspan
         x="45.373047"
         y="215.12477"
         id="tspan354">He tried once more, and sparks took flight,
</tspan><tspan
         x="45.373047"
         y="228.5819"
         id="tspan356">Then came a blast — a fiery fright!</tspan></text></g></svg>
