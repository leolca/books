         x="45.373047"
         y="188.21053"
         id="tspan211">Morfeu era forte, feroz, majestoso,
</tspan><tspan
         x="45.373047"
         y="201.66765"
         id="tspan213">E além disso tudo, também muito idoso.
</tspan><tspan
         x="45.373047"
         y="215.12477"
         id="tspan215">Também era sábio, gigante e valente,
</tspan><tspan
         x="45.373047"
         y="228.5819"
         id="tspan217">Com olhos de fogo e olhar reluzente.</tspan></text><text
       xml:space="preserve"
