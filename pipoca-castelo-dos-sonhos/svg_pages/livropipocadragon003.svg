         x="45.373047"
         y="188.21053"
         id="tspan219">À beira do rio do esquecimento,
</tspan><tspan
         x="45.373047"
         y="201.66765"
         id="tspan221">Que canta baixinho, em puro alento.
</tspan><tspan
         x="45.373047"
         y="215.12477"
         id="tspan223">Construiu sua torre bem junto à corrente,
</tspan><tspan
         x="45.373047"
         y="228.5819"
         id="tspan225">Pra ouvir sua música calma e fluente.</tspan></text></g></svg>
