         x="45.373047"
         y="188.21053"
         id="tspan342">But he missed a step, on ground unsure,
</tspan><tspan
         x="45.373047"
         y="201.66765"
         id="tspan344">And tumbled down into shadow obscure.
</tspan><tspan
         x="45.373047"
         y="215.12477"
         id="tspan346">“Careful! Beware!” the darkness cried,
</tspan><tspan
         x="45.373047"
         y="228.5819"
         id="tspan348">As growls and howls echoed inside.</tspan></text><text
       xml:space="preserve"
       transform="matrix(0.63544798,0,0,0.63544798,-23.499706,103.73508)"
       id="text954-0"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:10.7657px;font-family:Tuffy;-inkscape-font-specification:'Tuffy, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;white-space:pre;shape-inside:url(#rect956-9);display:inline;fill:#ffffff;stroke:none"><tspan
         x="45.373047"
         y="188.21053"
         id="tspan350">But then through the air came a curious tune,
</tspan><tspan
         x="45.373047"
         y="201.66765"
         id="tspan352">A melody soft, like a pull from the moon.
</tspan><tspan
         x="45.373047"
         y="215.12477"
         id="tspan354">It shimmered with beauty, gentle and deep,
</tspan><tspan
         x="45.373047"
         y="228.5819"
         id="tspan356">As if every note had a promise to keep.</tspan></text></g></svg>
