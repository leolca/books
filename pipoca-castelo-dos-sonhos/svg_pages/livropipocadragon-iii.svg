       id="text240"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:15.3333px;line-height:1.25;font-family:Tuffy;-inkscape-font-specification:'Tuffy, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;letter-spacing:0px;word-spacing:0px;white-space:pre;shape-inside:url(#rect242);display:inline;fill:#ffffff"><tspan
         x="127.79297"
         y="207.53883"
         id="tspan434">Dormir nem sempre é fácil — especialmente quando se é criança.
</tspan><tspan
         x="127.79297"
         y="226.70546"
         id="tspan436">Há o medo do escuro, o medo do desconhecido, o medo de perder o que está </tspan><tspan
         x="127.79297"
         y="245.87209"
         id="tspan438">acontecendo no mundo lá fora... e o medo de acordar sem saber onde se está.
</tspan><tspan
         x="127.79297"
         y="265.03871"
         id="tspan440">
</tspan><tspan
         x="127.79297"
         y="284.20534"
         id="tspan442">Mas o sono também pode ser um portal — e um caminho. Neste livro, o pequeno </tspan><tspan
         x="127.79297"
         y="303.37196"
         id="tspan444">Pipoca embarca numa travessia fantástica, onde dragões gostam de pizza, </tspan><tspan
         x="127.79297"
         y="322.53859"
         id="tspan446">vulcões entram em erupção, e uma raposa misteriosa aponta o caminho.
</tspan><tspan
         x="127.79297"
         y="341.70522"
         id="tspan448">
</tspan><tspan
         x="127.79297"
         y="360.87184"
         id="tspan450">A história é contada como uma balada: um poema narrativo com ritmo e rima — </tspan><tspan
         x="127.79297"
         y="380.03847"
         id="tspan452">como as antigas canções que passavam de geração em geração.
</tspan><tspan
         x="127.79297"
         y="399.20509"
         id="tspan454">
</tspan><tspan
         x="127.79297"
         y="418.37172"
         id="tspan456">Aqui e ali, você pode encontrar ecos de Alice em seu mergulho no buraco do </tspan><tspan
         x="127.79297"
         y="437.53834"
         id="tspan458">coelho, do mito de Orfeu e Eurídice, ou da Caverna de Platão.
</tspan><tspan
         x="127.79297"
         y="456.70497"
         id="tspan460">Mas, acima de tudo, encontrará o sonho de uma criança: confuso, vibrante, </tspan><tspan
         x="127.79297"
         y="475.8716"
         id="tspan462">cheio de símbolos e descobertas.
</tspan><tspan
         x="127.79297"
         y="495.03822"
         id="tspan464">
</tspan><tspan
         x="127.79297"
         y="514.20485"
         id="tspan466">Espero que este livro acompanhe o leitor — pequeno ou grande — como uma </tspan><tspan
         x="127.79297"
         y="533.37147"
         id="tspan468">história contada na rede, pouco antes de dormir.</tspan></text><text
       xml:space="preserve"
       transform="scale(0.26458333)"
