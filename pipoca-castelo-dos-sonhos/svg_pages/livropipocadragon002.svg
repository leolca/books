         x="45.373047"
         y="188.21053"
         id="tspan165">Pegou um livrinho guardado na estante,
</tspan><tspan
         x="45.373047"
         y="201.66765"
         id="tspan167">Com capa brilhante e dragão flamejante.
</tspan><tspan
         x="45.373047"
         y="215.12477"
         id="tspan169">Sentou-se à rede e o convidou a sentar.
</tspan><tspan
         x="45.373047"
         y="228.5819"
         id="tspan171">Pipoca, curioso, logo quis deitar.</tspan></text></g></svg>
