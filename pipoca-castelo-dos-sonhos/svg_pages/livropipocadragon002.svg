         x="45.373047"
         y="188.21053"
         id="tspan157">Começou a mamãe já envolta no breu.
</tspan><tspan
         x="45.373047"
         y="201.66765"
         id="tspan159">— É a lenda do grande dragão Morfeu,
</tspan><tspan
         x="45.373047"
         y="215.12477"
         id="tspan161">Guardião do castelo do Hipnos rei,
</tspan><tspan
         x="45.373047"
         y="228.5819"
         id="tspan163">Que não dormia, sofria, é o que sei.</tspan></text><text
