         x="45.373047"
         y="188.21053"
         id="tspan342">She gazed upon a half-open door,
</tspan><tspan
         x="45.373047"
         y="201.66765"
         id="tspan344">Leading to darkness, deep and more.
</tspan><tspan
         x="45.373047"
         y="215.12477"
         id="tspan346">It seemed the gateway to a dungeon’s lair—
</tspan><tspan
         x="45.373047"
         y="228.5819"
         id="tspan348">A cold wind gripped him, chilling the air.</tspan></text><text
       xml:space="preserve"
