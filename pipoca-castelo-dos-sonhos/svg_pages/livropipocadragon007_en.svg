         x="45.373047"
         y="188.21053"
         id="tspan350">Popcorn, curious, followed her lead,
</tspan><tspan
         x="45.373047"
         y="201.66765"
         id="tspan352">Treading softly, careful in deed.
</tspan><tspan
         x="45.373047"
         y="215.12477"
         id="tspan354">Turning the corner, what did he find?
</tspan><tspan
         x="45.373047"
         y="228.5819"
         id="tspan356">The fox stood still, calm and kind.
</tspan></text></g></svg>
