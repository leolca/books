         x="45.373047"
         y="188.21053"
         id="tspan342">O'er valleys and hills he flew with grace,
</tspan><tspan
         x="45.373047"
         y="201.66765"
         id="tspan344">Till a shimmering lake appeared in place.
</tspan><tspan
         x="45.373047"
         y="215.12477"
         id="tspan346">He dove through the air and landed below,
</tspan><tspan
         x="45.373047"
         y="228.5819"
         id="tspan348">Gasping for air, his eyes all aglow.</tspan></text><text
       xml:space="preserve"
       transform="matrix(0.63544798,0,0,0.63544798,-19.072716,102.47134)"
       id="text954-0"
