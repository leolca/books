         x="45.373047"
         y="188.21053"
         id="tspan350">His wings gave a flap, instinctive and wide,
</tspan><tspan
         x="45.373047"
         y="201.66765"
         id="tspan352">And lifted up Popcorn in powerful stride.
</tspan><tspan
         x="45.373047"
         y="215.12477"
         id="tspan354">He soared past the peak, the smoke, and the flame,
</tspan><tspan
         x="45.373047"
         y="228.5819"
         id="tspan356">Far from the fear and fire no one can tame.</tspan></text></g></svg>
