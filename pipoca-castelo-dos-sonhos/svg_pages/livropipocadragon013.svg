         x="45.373047"
         y="188.21053"
         id="tspan157">— Uau! Sou um dragão! — falou com fervor,
</tspan><tspan
         x="45.373047"
         y="201.66765"
         id="tspan159">Sentindo surpresa, mas também esplendor.
</tspan><tspan
         x="45.373047"
         y="215.12477"
         id="tspan161">Será que consigo, pensou sem pudor,
</tspan><tspan
         x="45.373047"
         y="228.5819"
         id="tspan163">Soltar chamas vivas, cuspir puro ardor?</tspan></text><text
       xml:space="preserve"
       transform="matrix(0.63544798,0,0,0.63544798,-19.072716,102.47134)"
       id="text954-0"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:10.7657px;font-family:Tuffy;-inkscape-font-specification:'Tuffy, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;white-space:pre;shape-inside:url(#rect956-9);display:inline;fill:#ffffff;stroke:none"><tspan
         x="45.373047"
         y="188.21053"
         id="tspan165">Curvou-se à margem, fitou seu espelho,
</tspan><tspan
         x="45.373047"
         y="201.66765"
         id="tspan167">Buscou encontrar indivíduo parelho.
</tspan><tspan
         x="45.373047"
         y="215.12477"
         id="tspan169">E viu refletido, com ar de espanto,
</tspan><tspan
         x="45.373047"
         y="228.5819"
         id="tspan171">Um ser lendário, de escamas e encanto.</tspan></text></g></svg>
