           x="45.373047"
           y="187.31964"
           id="tspan442">Leonardo Araújo</tspan></text></g><text
       xml:space="preserve"
       transform="matrix(0.63544798,0,0,0.63544798,-18.382683,80.249212)"
       id="text954"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:8.88262px;font-family:Tuffy;-inkscape-font-specification:'Tuffy, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;white-space:pre;shape-inside:url(#rect956-1);display:inline;fill:#ffffff;stroke:none"><tspan
         x="45.373047"
         y="186.54447"
         id="tspan444">Popcorn and the Castle of Dreams is a magical journey through </tspan><tspan
         x="45.373047"
         y="197.64774"
         id="tspan446">the world of sleep and children's imagination. Among dragons, </tspan><tspan
         x="45.373047"
         y="208.75101"
         id="tspan448">pizza and volcanoes, fears become adventures, fantasies are </tspan><tspan
         x="45.373047"
         y="219.85428"
         id="tspan450">confused with reality, and even the fiercest of guardians reveals </tspan><tspan
         x="45.373047"
         y="230.95755"
         id="tspan452">his vulnerability. Written in the form of a narrative ballad, the </tspan><tspan
         x="45.373047"
         y="242.06083"
         id="tspan454">book celebrates the transformative power of dreams and the </tspan><tspan
         x="45.373047"
         y="253.1641"
         id="tspan456">beauty — and wonder — of growing up.</tspan></text></g></svg>
