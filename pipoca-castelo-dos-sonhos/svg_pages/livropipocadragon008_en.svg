         x="45.373047"
         y="188.21053"
         id="tspan342">He stepped inside, not to be mislead,
</tspan><tspan
         x="45.373047"
         y="201.66765"
         id="tspan344">Fear in his heart, but courage ahead.
</tspan><tspan
         x="45.373047"
         y="215.12477"
         id="tspan346">The darkness wrapped so cold, so still,
</tspan><tspan
         x="45.373047"
         y="228.5819"
         id="tspan348">An echoing void, a silent chill.</tspan></text><text
       xml:space="preserve"
       transform="matrix(0.63544798,0,0,0.63544798,-19.072716,-104.65094)"
       id="text954-0"
