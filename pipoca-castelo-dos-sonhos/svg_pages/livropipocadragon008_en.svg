         x="45.373047"
         y="188.21053"
         id="tspan350">His rust-red tail, a fading glow,
</tspan><tspan
         x="45.373047"
         y="201.66765"
         id="tspan352">The last bright color he’d come to know.
</tspan><tspan
         x="45.373047"
         y="215.12477"
         id="tspan354">Like something dreamed beyond his sight,
</tspan><tspan
         x="45.373047"
         y="228.5819"
         id="tspan356">He moved with caution, dread in plight.</tspan></text></g></svg>
