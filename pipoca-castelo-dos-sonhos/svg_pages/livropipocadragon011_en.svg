         x="45.373047"
         y="188.21053"
         id="tspan342">Popcorn stood trembling, ready to flee,
</tspan><tspan
         x="45.373047"
         y="201.66765"
         id="tspan344">But something strange stirred suddenly.
</tspan><tspan
         x="45.373047"
         y="215.12477"
         id="tspan346">He felt a great weight, turned with surprise —
</tspan><tspan
         x="45.373047"
         y="228.5819"
         id="tspan348">Two wings had spread from his back to the skies!</tspan></text><text
       xml:space="preserve"
       transform="matrix(0.63544798,0,0,0.63544798,-19.072716,-104.26346)"
       id="text954-0"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:10.7657px;font-family:Tuffy;-inkscape-font-specification:'Tuffy, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;white-space:pre;shape-inside:url(#rect956-9);display:inline;fill:#ffffff;stroke:none"><tspan
         x="45.373047"
         y="188.21053"
         id="tspan350">At last he emerged, high over the land,
</tspan><tspan
         x="45.373047"
         y="201.66765"
         id="tspan352">On the towering peak of a mountain so grand.
</tspan><tspan
         x="45.373047"
         y="215.12477"
         id="tspan354">There stood a volcano, roaring with might,
</tspan><tspan
         x="45.373047"
         y="228.5819"
         id="tspan356">Spewing its fire in a terrible sight!</tspan></text></g></svg>
