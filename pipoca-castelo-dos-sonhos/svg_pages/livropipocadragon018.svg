       preserveAspectRatio="none"
       xlink:href="../imagens/pipoca-dragon-021.png"
       id="image309"
       x="-14.19603"
       y="-0.9973526" /><text
       xml:space="preserve"
       transform="matrix(0.63544798,0,0,0.63544798,-16.924946,-100.98958)"
       id="text954"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:8.88262px;font-family:Tuffy;-inkscape-font-specification:'Tuffy, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;white-space:pre;shape-inside:url(#rect956);display:inline;fill:#ffffff;stroke:none"><tspan
         x="45.373047"
         y="186.54447"
         id="tspan319">&quot;Pipoca e o Castelo dos Sonhos&quot; é mais do que uma história de </tspan><tspan
         x="45.373047"
         y="197.64774"
         id="tspan321">dormir — é uma travessia. Através de uma narrativa poética </tspan><tspan
         x="45.373047"
         y="208.75101"
         id="tspan323">explora, com leveza e profundidade, o território simbólico do sono </tspan><tspan
         x="45.373047"
         y="219.85428"
         id="tspan325">infantil — um espaço de transição entre o real e o imaginário, </tspan><tspan
         x="45.373047"
         y="230.95755"
         id="tspan327">entre a infância e o desenvolvimento.
</tspan><tspan
         x="45.373047"
         y="242.06083"
         id="tspan329">
</tspan><tspan
         x="45.373047"
         y="253.1641"
         id="tspan331">A jornada de Pipoca começa como tantas noites de infância: com </tspan><tspan
         x="45.373047"
         y="264.26737"
         id="tspan333">relutância, brincadeiras e um convite ao repouso. Mas ao </tspan><tspan
         x="45.373047"
         y="275.37064"
         id="tspan335">adormecer, ele mergulha num mundo onírico em que figuras </tspan><tspan
         x="45.373047"
         y="286.47391"
         id="tspan337">simbólicas e situações fantásticas compõem uma narrativa </tspan><tspan
         x="45.373047"
         y="297.57718"
         id="tspan339">arquetípica.
</tspan><tspan
         x="45.373047"
         y="308.68045"
         id="tspan341">
</tspan><tspan
         x="45.373047"
         y="319.78373"
         id="tspan343">A história dialoga com diferentes tradições míticas e filosóficas. </tspan><tspan
         x="45.373047"
         y="330.887"
         id="tspan345">Ao seguir uma raposa etérea por um túnel escuro, Pipoca se </tspan><tspan
         x="45.373047"
         y="341.99027"
         id="tspan347">aproxima do mito de Orfeu, que desce ao submundo em busca de </tspan><tspan
         x="45.373047"
         y="353.09354"
         id="tspan349">Eurídice. Como Orfeu, Pipoca é guiado por uma figura que </tspan><tspan
         x="45.373047"
         y="364.19681"
         id="tspan351">representa o elo com o mundo conhecido. A música suave que o </tspan><tspan
         x="45.373047"
         y="375.30008"
         id="tspan353">atrai no início — e que logo se distorce em caos e ruído — remete </tspan><tspan
         x="45.373047"
         y="386.40335"
         id="tspan355">à lira de Orfeu: um chamado hipnótico que abre caminhos, mas </tspan><tspan
         x="45.373047"
         y="397.50663"
         id="tspan357">não garante retorno.
</tspan><tspan
         x="45.373047"
         y="408.6099"
         id="tspan359">
</tspan><tspan
         x="45.373047"
         y="419.71317"
         id="tspan361">A jornada onírica de Pipoca também ecoa Alice no País das </tspan><tspan
         x="45.373047"
         y="430.81644"
         id="tspan363">Maravilhas, cuja queda pelo buraco do coelho a conduz a um </tspan><tspan
         x="45.373047"
         y="441.91971"
         id="tspan365">mundo de transformações físicas abruptas, onde tamanho, forma </tspan><tspan
         x="45.373047"
         y="453.02298"
         id="tspan367">e lógica vacilam. Assim como Alice, Pipoca se transforma — </tspan><tspan
         x="45.373047"
         y="464.12626"
         id="tspan369">literalmente — ao longo de sua travessia. Suas asas surgem não </tspan><tspan
         x="45.373047"
         y="475.22953"
         id="tspan371">como símbolo de poder absoluto, mas como resposta ao medo, à </tspan><tspan
         x="45.373047"
         y="486.3328"
         id="tspan373">perda e ao desconhecido.
</tspan><tspan
         x="45.373047"
         y="497.43607"
         id="tspan375">
</tspan></text><text
       xml:space="preserve"
       transform="matrix(0.63544798,0,0,0.63544798,161.77674,-100.98958)"
       id="text954-1"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:8.88262px;font-family:Tuffy;-inkscape-font-specification:'Tuffy, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;white-space:pre;shape-inside:url(#rect956-6);display:inline;fill:#ffffff;stroke:none"><tspan
         x="45.373047"
         y="186.54447"
         id="tspan377">Nesse processo, o túnel que atravessa representa o submundo — </tspan><tspan
         x="45.373047"
         y="197.64774"
         id="tspan379">o lugar das sombras, da confusão, do confronto com o que é </tspan><tspan
         x="45.373047"
         y="208.75101"
         id="tspan381">estranho e ameaçador. É um espaço de dissolução da forma </tspan><tspan
         x="45.373047"
         y="219.85428"
         id="tspan383">anterior e de preparação para algo novo. Ao emergir do túnel, já </tspan><tspan
         x="45.373047"
         y="230.95755"
         id="tspan385">transformado, Pipoca enfrenta um novo perigo: um vulcão em </tspan><tspan
         x="45.373047"
         y="242.06083"
         id="tspan387">erupção. A transição não lhe concede paz imediata, mas o coloca </tspan><tspan
         x="45.373047"
         y="253.1641"
         id="tspan389">diante de um novo estágio de sua jornada.
</tspan><tspan
         x="45.373047"
         y="264.26737"
         id="tspan391">
</tspan><tspan
         x="45.373047"
         y="275.37064"
         id="tspan393">O livro também evoca a alegoria da Caverna de Platão, ao tratar </tspan><tspan
         x="45.373047"
         y="286.47391"
         id="tspan395">do sono como um espaço de percepção limitada e ilusória. Como </tspan><tspan
         x="45.373047"
         y="297.57718"
         id="tspan397">os prisioneiros que tomam sombras por realidade, Pipoca vive </tspan><tspan
         x="45.373047"
         y="308.68045"
         id="tspan399">intensamente o mundo do sonho — até que, ao acordar, tudo </tspan><tspan
         x="45.373047"
         y="319.78373"
         id="tspan401">parece distante e irreversível. A infância, nesse sentido, é nossa </tspan><tspan
         x="45.373047"
         y="330.887"
         id="tspan403">primeira caverna: onde aprendemos a discernir o que vemos, </tspan><tspan
         x="45.373047"
         y="341.99027"
         id="tspan405">sentimos e acreditamos.
</tspan><tspan
         x="45.373047"
         y="353.09354"
         id="tspan407">
</tspan><tspan
         x="45.373047"
         y="364.19681"
         id="tspan409">As referências mitológicas se estendem ao cenário: Hipnos, o </tspan><tspan
         x="45.373047"
         y="375.30008"
         id="tspan411">deus grego do sono, é reimaginado como rei de um castelo às </tspan><tspan
         x="45.373047"
         y="386.40335"
         id="tspan413">margens do rio do esquecimento, em alusão direta à geografia </tspan><tspan
         x="45.373047"
         y="397.50663"
         id="tspan415">onírica dos mitos gregos. Seu guardião, o dragão Morfeu — nome </tspan><tspan
         x="45.373047"
         y="408.6099"
         id="tspan417">do deus dos sonhos — representa tanto o perigo quanto a </tspan><tspan
         x="45.373047"
         y="419.71317"
         id="tspan419">sabedoria adormecida, e carrega consigo a noção clássica de que </tspan><tspan
         x="45.373047"
         y="430.81644"
         id="tspan421">até o ser mais poderoso possui um ponto fraco.
</tspan><tspan
         x="45.373047"
         y="441.91971"
         id="tspan423">
</tspan><tspan
         x="45.373047"
         y="453.02298"
         id="tspan425">No fim, Pipoca ainda sonha... Sua aventura é um rito de </tspan><tspan
         x="45.373047"
         y="464.12626"
         id="tspan427">passagem em forma de sonho: cômico, poético, assustador e </tspan><tspan
         x="45.373047"
         y="475.22953"
         id="tspan429">libertador. E como acontece com os sonhos mais marcantes, </tspan><tspan
         x="45.373047"
         y="486.3328"
         id="tspan431">talvez ele se lembre de tudo — ou talvez tudo evapore com os </tspan><tspan
         x="45.373047"
         y="497.43607"
         id="tspan433">primeiros raios de sol. Mas algo permanece: a travessia feita, e a </tspan><tspan
         x="45.373047"
         y="508.53934"
         id="tspan435">certeza silenciosa de que há muito mais em nós do que </tspan><tspan
         x="45.373047"
         y="519.64261"
         id="tspan437">imaginamos.
</tspan></text></g></svg>
