         x="45.373047"
         y="188.21053"
         id="tspan366">But as with all creatures of power and might,
</tspan><tspan
         x="45.373047"
         y="201.66765"
         id="tspan368">He carried a weakness hidden from sight:
</tspan><tspan
         x="45.373047"
         y="215.12477"
         id="tspan370">Morpheus longed for pizza and treats,
</tspan><tspan
         x="45.373047"
         y="228.5819"
         id="tspan372">More than a guard — the hungriest of beasts.</tspan></text></g></svg>
