         x="45.373047"
         y="188.21053"
         id="tspan358">Then came a knight, both clever and sly,
</tspan><tspan
         x="45.373047"
         y="201.66765"
         id="tspan360">Who learned of the secret and gleam in his eye.
</tspan><tspan
         x="45.373047"
         y="215.12477"
         id="tspan362">He carried a pizza tied to his side,
</tspan><tspan
         x="45.373047"
         y="228.5819"
         id="tspan364">And slipped past the gate as the dragon was beguiled.</tspan></text><text
       xml:space="preserve"
