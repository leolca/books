       xml:space="preserve"
       transform="matrix(0.26458333,0,0,0.26458333,165.09521,-23.150486)"
       id="text240"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:15.3333px;line-height:1.25;font-family:Tuffy;-inkscape-font-specification:'Tuffy, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;letter-spacing:0px;word-spacing:0px;white-space:pre;shape-inside:url(#rect242);display:inline;fill:#ffffff"><tspan
         x="127.79297"
         y="207.53883"
         id="tspan380">Sleeping isn’t always easy — especially when you’re a child. There’s the fear of </tspan><tspan
         x="127.79297"
         y="226.70546"
         id="tspan382">the dark, the fear of the unknown, the fear of missing out on what’s happening </tspan><tspan
         x="127.79297"
         y="245.87209"
         id="tspan384">in the outside world... and the fear of waking up not knowing where you are.
</tspan><tspan
         x="127.79297"
         y="265.03871"
         id="tspan386">
</tspan><tspan
         x="127.79297"
         y="284.20534"
         id="tspan388">But sleep can also be a portal — and a path. In this book, little Pipoca embarks </tspan><tspan
         x="127.79297"
         y="303.37196"
         id="tspan390">on a fantastic journey, where dragons like pizza, volcanoes erupt, and a </tspan><tspan
         x="127.79297"
         y="322.53859"
         id="tspan392">mysterious fox points the way.
</tspan><tspan
         x="127.79297"
         y="341.70522"
         id="tspan394">
</tspan><tspan
         x="127.79297"
         y="360.87184"
         id="tspan396">The story is told like a ballad: a narrative poem with rhythm and rhyme — like </tspan><tspan
         x="127.79297"
         y="380.03847"
         id="tspan398">the old songs that were passed down from generation to generation.
</tspan><tspan
         x="127.79297"
         y="399.20509"
         id="tspan400">
</tspan><tspan
         x="127.79297"
         y="418.37172"
         id="tspan402">Here and there, you can find echoes of Alice diving down the rabbit hole, the </tspan><tspan
         x="127.79297"
         y="437.53834"
         id="tspan404">myth of Orpheus and Eurydice, or Plato’s Cave.
</tspan><tspan
         x="127.79297"
         y="456.70497"
         id="tspan406">
</tspan><tspan
         x="127.79297"
         y="475.8716"
         id="tspan408">But above all, you’ll find a child’s dream: confusing, vibrant, full of symbols and </tspan><tspan
         x="127.79297"
         y="495.03822"
         id="tspan410">discoveries.
</tspan><tspan
         x="127.79297"
         y="514.20485"
         id="tspan412">
</tspan><tspan
         x="127.79297"
         y="533.37147"
         id="tspan414">I hope this book accompanies the reader — young or old — like a story told in </tspan><tspan
         x="127.79297"
         y="552.5381"
         id="tspan416">the hammock, just before going to sleep.</tspan></text><text
       xml:space="preserve"
       transform="scale(0.26458333)"
       id="text1234"
