         x="45.373047"
         y="188.21053"
         id="tspan219">Chega ao fundo, num túnel sombrio,
</tspan><tspan
         x="45.373047"
         y="201.66765"
         id="tspan221">Tateia as paredes com certo arrepio.
</tspan><tspan
         x="45.373047"
         y="215.12477"
         id="tspan223">Avança com calma, sem ver onde vai,
</tspan><tspan
         x="45.373047"
         y="228.5819"
         id="tspan225">Com peito apertado, respira: ai!</tspan></text></g></svg>
