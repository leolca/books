         x="45.373047"
         y="188.21053"
         id="tspan211">Mas logo adiante, uma luz a brilhar —
</tspan><tspan
         x="45.373047"
         y="201.66765"
         id="tspan213">Se for a saída, virá a calhar!
</tspan><tspan
         x="45.373047"
         y="215.12477"
         id="tspan215">Seu peito se acalma, alívio, contento:
</tspan><tspan
         x="45.373047"
         y="228.5819"
         id="tspan217">Talvez logo escapasse do túnel esquecimento.
</tspan></text><text
       xml:space="preserve"
       transform="matrix(0.63544798,0,0,0.63544798,-19.072716,-104.26346)"
