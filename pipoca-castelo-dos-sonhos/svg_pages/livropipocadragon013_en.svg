         x="45.373047"
         y="188.21053"
         id="tspan342">&quot;Wow! I’m a dragon!&quot; he cried in delight,
</tspan><tspan
         x="45.373047"
         y="201.66765"
         id="tspan344">In wonder and awe at the magical sight.
</tspan><tspan
         x="45.373047"
         y="215.12477"
         id="tspan346">&quot;Could I breathe fire?&quot; he thought with a grin,
</tspan><tspan
         x="45.373047"
         y="228.5819"
         id="tspan348">And send a bright blaze from within?</tspan></text><text
       xml:space="preserve"
       transform="matrix(0.63544798,0,0,0.63544798,-19.072716,102.47134)"
       id="text954-0"
