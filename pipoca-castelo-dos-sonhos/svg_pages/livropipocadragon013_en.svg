         x="45.373047"
         y="188.21053"
         id="tspan350">He knelt by the shore and looked down below,
</tspan><tspan
         x="45.373047"
         y="201.66765"
         id="tspan352">To find a reflection he ought to know.
</tspan><tspan
         x="45.373047"
         y="215.12477"
         id="tspan354">But staring back with a startled gleam
</tspan><tspan
         x="45.373047"
         y="228.5819"
         id="tspan356">Was a scaled, bright creature from some old dream.</tspan></text></g></svg>
