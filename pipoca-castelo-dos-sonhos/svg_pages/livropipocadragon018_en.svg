       preserveAspectRatio="none"
       xlink:href="../imagens/pipoca-dragon-021.png"
       id="image309"
       x="-14.19603"
       y="-0.9973526" /><text
       xml:space="preserve"
       transform="matrix(0.63544798,0,0,0.63544798,-16.924946,-100.98958)"
       id="text954"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:8.88262px;font-family:Tuffy;-inkscape-font-specification:'Tuffy, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;white-space:pre;shape-inside:url(#rect956);display:inline;fill:#ffffff;stroke:none"><tspan
         x="45.373047"
         y="186.54447"
         id="tspan381">&quot;Pipoca and the Castle of Dreams&quot; is more than a bedtime story </tspan><tspan
         x="45.373047"
         y="197.64774"
         id="tspan383">— it is a journey. Through a poetic narrative, it explores, with </tspan><tspan
         x="45.373047"
         y="208.75101"
         id="tspan385">lightness and depth, the symbolic territory of childhood sleep — a </tspan><tspan
         x="45.373047"
         y="219.85428"
         id="tspan387">space of transition between reality and imagination, between </tspan><tspan
         x="45.373047"
         y="230.95755"
         id="tspan389">childhood and development.
</tspan><tspan
         x="45.373047"
         y="242.06083"
         id="tspan391">
</tspan><tspan
         x="45.373047"
         y="253.1641"
         id="tspan393">Pipoca's journey begins like so many childhood nights: with </tspan><tspan
         x="45.373047"
         y="264.26737"
         id="tspan395">reluctance, games and an invitation to rest. But when he falls </tspan><tspan
         x="45.373047"
         y="275.37064"
         id="tspan397">asleep, he plunges into a dream world in which symbolic figures </tspan><tspan
         x="45.373047"
         y="286.47391"
         id="tspan399">and fantastic situations make up an archetypal narrative.
</tspan><tspan
         x="45.373047"
         y="297.57718"
         id="tspan401">
</tspan><tspan
         x="45.373047"
         y="308.68045"
         id="tspan403">The story dialogues with different mythical and philosophical </tspan><tspan
         x="45.373047"
         y="319.78373"
         id="tspan405">traditions. By following an ethereal fox through a dark tunnel, </tspan><tspan
         x="45.373047"
         y="330.887"
         id="tspan407">Pipoca approaches the myth of Orpheus, who descends into the </tspan><tspan
         x="45.373047"
         y="341.99027"
         id="tspan409">underworld in search of Eurydice. Like Orpheus, Pipoca is guided </tspan><tspan
         x="45.373047"
         y="353.09354"
         id="tspan411">by a figure who represents the link with the known world. The </tspan><tspan
         x="45.373047"
         y="364.19681"
         id="tspan413">soft music that initially attracts him — and which soon becomes </tspan><tspan
         x="45.373047"
         y="375.30008"
         id="tspan415">chaos and noise — is reminiscent of Orpheus’s lyre: a hypnotic </tspan><tspan
         x="45.373047"
         y="386.40335"
         id="tspan417">call that opens paths but guarantees no return.
</tspan><tspan
         x="45.373047"
         y="397.50663"
         id="tspan419">
</tspan><tspan
         x="45.373047"
         y="408.6099"
         id="tspan421">Pipoca’s dreamlike journey also echoes Alice in Wonderland, </tspan><tspan
         x="45.373047"
         y="419.71317"
         id="tspan423">whose fall down the rabbit hole leads her to a world of abrupt </tspan><tspan
         x="45.373047"
         y="430.81644"
         id="tspan425">physical transformations, where size, shape, and logic falter. Like </tspan><tspan
         x="45.373047"
         y="441.91971"
         id="tspan427">Alice, Pipoca transforms — literally — throughout his journey. His </tspan><tspan
         x="45.373047"
         y="453.02298"
         id="tspan429">wings emerge not as a symbol of absolute power, but as a </tspan><tspan
         x="45.373047"
         y="464.12626"
         id="tspan431">response to fear, loss, and the unknown.</tspan></text><text
       xml:space="preserve"
       transform="matrix(0.63544798,0,0,0.63544798,161.77674,-100.98958)"
       id="text954-1"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:8.88262px;font-family:Tuffy;-inkscape-font-specification:'Tuffy, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;white-space:pre;shape-inside:url(#rect956-6);display:inline;fill:#ffffff;stroke:none"><tspan
         x="45.373047"
         y="186.54447"
         id="tspan433">In this process, the tunnel he traverses represents the </tspan><tspan
         x="45.373047"
         y="197.64774"
         id="tspan435">underworld — the place of shadows, confusion, and confrontation </tspan><tspan
         x="45.373047"
         y="208.75101"
         id="tspan437">with what is strange and threatening. It is a space for dissolving </tspan><tspan
         x="45.373047"
         y="219.85428"
         id="tspan439">the previous form and preparing for something new. Upon </tspan><tspan
         x="45.373047"
         y="230.95755"
         id="tspan441">emerging from the tunnel, already transformed, Pipoca faces a </tspan><tspan
         x="45.373047"
         y="242.06083"
         id="tspan443">new danger: an erupting volcano. The transition does not grant </tspan><tspan
         x="45.373047"
         y="253.1641"
         id="tspan445">him immediate peace, but rather places him before a new stage </tspan><tspan
         x="45.373047"
         y="264.26737"
         id="tspan447">of his journey.
</tspan><tspan
         x="45.373047"
         y="275.37064"
         id="tspan449">
</tspan><tspan
         x="45.373047"
         y="286.47391"
         id="tspan451">The book also evokes Plato's allegory of the Cave, when it treats </tspan><tspan
         x="45.373047"
         y="297.57718"
         id="tspan453">sleep as a space of limited and illusory perception. Like prisoners </tspan><tspan
         x="45.373047"
         y="308.68045"
         id="tspan455">who mistake shadows for reality, Pipoca lives intensely in the </tspan><tspan
         x="45.373047"
         y="319.78373"
         id="tspan457">world of dreams — until, upon waking, everything seems distant </tspan><tspan
         x="45.373047"
         y="330.887"
         id="tspan459">and irreversible. Childhood, in this sense, is our first cave: where </tspan><tspan
         x="45.373047"
         y="341.99027"
         id="tspan461">we learn to discern what we see, feel and believe.
</tspan><tspan
         x="45.373047"
         y="353.09354"
         id="tspan463">
</tspan><tspan
         x="45.373047"
         y="364.19681"
         id="tspan465">The mythological references extend to the setting: Hypnos, the </tspan><tspan
         x="45.373047"
         y="375.30008"
         id="tspan467">Greek god of sleep, is reimagined as the king of a castle on the </tspan><tspan
         x="45.373047"
         y="386.40335"
         id="tspan469">banks of the river of oblivion, in a direct allusion to the dreamlike </tspan><tspan
         x="45.373047"
         y="397.50663"
         id="tspan471">geography of Greek myths. His guardian, the dragon Morpheus — </tspan><tspan
         x="45.373047"
         y="408.6099"
         id="tspan473">the name of the god of dreams — represents both danger and </tspan><tspan
         x="45.373047"
         y="419.71317"
         id="tspan475">dormant wisdom, and carries with it the classic notion that even </tspan><tspan
         x="45.373047"
         y="430.81644"
         id="tspan477">the most powerful being has a weak spot.
</tspan><tspan
         x="45.373047"
         y="441.91971"
         id="tspan479">
</tspan><tspan
         x="45.373047"
         y="453.02298"
         id="tspan481">In the end, Pipoca is still dreaming... His adventure is a rite of </tspan><tspan
         x="45.373047"
         y="464.12626"
         id="tspan483">passage in the form of a dream: comical, poetic, frightening and </tspan><tspan
         x="45.373047"
         y="475.22953"
         id="tspan485">liberating. And as with the most striking dreams, perhaps he will </tspan><tspan
         x="45.373047"
         y="486.3328"
         id="tspan487">remember everything — or perhaps it will all evaporate with the </tspan><tspan
         x="45.373047"
         y="497.43607"
         id="tspan489">first rays of sunlight. But something remains: the crossing made, </tspan><tspan
         x="45.373047"
         y="508.53934"
         id="tspan491">and the silent certainty that there is much more to us than we </tspan><tspan
         x="45.373047"
         y="519.64261"
         id="tspan493">imagine.
</tspan></text></g></svg>
