         x="45.373047"
         y="188.21053"
         id="tspan350">Then, with courage and a clever plan in hand,
</tspan><tspan
         x="45.373047"
         y="201.66765"
         id="tspan352">The knight crossed the darkness, firm did stand.
</tspan><tspan
         x="45.373047"
         y="215.12477"
         id="tspan354">He seized the moment, while the dragon’s guard was low,
</tspan><tspan
         x="45.373047"
         y="228.5819"
         id="tspan356">And slipped through the gate with steps soft and mellow.</tspan></text></g></svg>
