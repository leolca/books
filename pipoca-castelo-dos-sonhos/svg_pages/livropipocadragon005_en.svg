         x="45.373047"
         y="188.21053"
         id="tspan342">As he listened, he slowly grew still,
</tspan><tspan
         x="45.373047"
         y="201.66765"
         id="tspan344">His eyelids drooping, the night calm and chill.
</tspan><tspan
         x="45.373047"
         y="215.12477"
         id="tspan346">In a gentle breath, without a faintest stir,
</tspan><tspan
         x="45.373047"
         y="228.5819"
         id="tspan348">Popcorn soon drifted to sleep, just a soft whirr.</tspan></text><text
       xml:space="preserve"
