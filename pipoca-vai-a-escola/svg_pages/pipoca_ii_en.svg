         x="127.79297"
         y="209.53818"
         id="tspan1655">Popcorn Goes to School
</tspan><tspan
         x="127.79297"
         y="231.2048"
         id="tspan1657">
</tspan><tspan
         x="127.79297"
         y="252.87143"
         id="tspan1659">Written by Leonardo Araújo 
</tspan><tspan
         x="127.79297"
         y="274.53805"
         id="tspan1661">Illustrations created with the help of Sora and ChatGPT.
</tspan><tspan
         x="127.79297"
         y="296.20468"
         id="tspan1663">
</tspan></text><g
       id="SVGRepo_bgCarrier"
       stroke-width="0"
       transform="matrix(0.26458333,0,0,0.26458333,86.865195,97.70787)" /><g
       id="SVGRepo_tracerCarrier"
