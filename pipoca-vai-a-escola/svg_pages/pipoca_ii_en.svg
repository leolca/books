       id="text184"
       style="font-size:17.3333px;font-family:Cantarell;-inkscape-font-specification:'Cantarell, Normal';white-space:pre;shape-inside:url(#rect186);display:inline;fill:#803300" /><text
       xml:space="preserve"
       transform="scale(0.26458333)"
       id="text190"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:17.3333px;font-family:Cantarell;-inkscape-font-specification:'Cantarell, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;white-space:pre;shape-inside:url(#rect192);display:inline;fill:#803300"><tspan
         x="-65.617188"
         y="-260.07706"
         id="tspan1665">A young Tyrannosaurus Rex, just a toddler, rendered in a charming watercolor style (aquarelle painting method). </tspan><tspan
         x="-65.617188"
         y="-238.41043"
         id="tspan1667">His primary color is a sunny yellow, the kind that makes you smile. He's been drawn with a slimmer, more </tspan><tspan
         x="-65.617188"
         y="-216.74381"
         id="tspan1669">elongated body than you might typically imagine for a T-Rex, emphasizing his youthfulness. This makes him </tspan><tspan
         x="-65.617188"
         y="-195.07718"
         id="tspan1671">appear a little taller and less bulky, enhancing his cute and approachable demeanor. His head is large and round </tspan><tspan
         x="-65.617188"
         y="-173.41055"
         id="tspan1673">with big, endearing eyes that are a deep, captivating blue, complete with bright white highlights that make them </tspan><tspan
         x="-65.617188"
         y="-151.74393"
         id="tspan1675">sparkle. A gentle smile curves his mouth, revealing tiny, harmless teeth. His small arms, characteristic of a T-Rex, </tspan><tspan
         x="-65.617188"
         y="-130.0773"
         id="tspan1677">are held slightly away from his body, and his sturdy legs end in rounded, three-clawed feet. A row of soft, rounded </tspan><tspan
         x="-65.617188"
         y="-108.41068"
         id="tspan1679">spikes runs down his back and along his tail, painted in slightly muted shades of yellow and orange, adding to his </tspan><tspan
         x="-65.617188"
         y="-86.74405"
         id="tspan1681">gentle appearance. Present the young Tyrannosaurus Rex looking through a magnifying glass. Use a front-on view </tspan><tspan
         x="-65.617188"
         y="-65.077424"
         id="tspan1683">so that the lens of the magnifying glass appears in front of him, increasing the detail of his face. He is smiling and </tspan><tspan
         x="-65.617188"
         y="-24.688386"
         id="tspan1687"><tspan
           dx="0 9.8279715 8.8746347 8.3199768 4.2639961 9.8279724 9.8799744 3.8133125 5.8933258 9.6719894 9.8279724 4.4373322 3.8133163 9.8106461 9.8279724 9.1519775 3.8133163 13.571983 8.874649 6.257309 9.1519928 6.534668 8.0946655 9.8279724 4.8186493 9.8279724 6.534668 3.8133087 6.2573242 9.1519775 8.0946655 9.8279724 9.8279724 4.2640076 9.8799744 9.6719971 9.1519775 3.8132935 9.8799744 4.2640076 8.3199768 9.1519775 8.0426636 3.813324 9.8279724 4.2639771 15.3573 3.813324 8.8746338 3.813324 8.0426636 9.8279724 5.8933105 6.2573242 4.4373474 3.8132935 8.0426636 4.8186646 4.2640076 9.8799744 9.8279724 6.2573242 4.818634 8.3199768 3.813324 6.2573242 9.1519775 8.129303 6.2573242 9.6719971 6.534668 9.1519775 9.8800049 3.8132935 4.8186646 9.8279419 9.8280029 8.631958 4.4373169 3.8133545 8.8746338 8.0426636 3.8132935 4.2639771 5.8933105 3.8133545 6.2573242 9.8279419 9.1519775 3.8133545 9.8972778 8.8746338 4.2639771 9.8280029 6.2573242 3.8132935 9.8280029 8.8746338 8.0426636 3.8132935 4.2639771 9.6719971 8.0426636 6.2573242 3.8132935 9.8800049 6.534668 4.2639771 9.1519775 9.8800049 3.8132935 9.8280029 9.8279419 3.8133545 6.2572632 9.8280029 9.1519775 3.8132935 9.8973389 8.8746338 9.8799438 9.1519775 4.4373779 3.8132935 9.8972778 9.1519775 6.534668 5.8933105 9.1520386 8.0946655 6.2573242 3.8132935 5.8933105 9.8280029 6.534668 3.8132935 8.8746338 3.8132935 8.0426636 13.572021 9.1519775 9.1519775 6.2573242 3.8133545 4.263916 4.8187256 4.8186035 9.6719971 8.0427246 6.2573242 6.534668 8.8746338 6.2573242 4.263916 9.8280029 9.8280029 3.8132324 4.2640381 9.8280029 3.8132324 8.8746338 3.8133545 6.2573242 9.8280029 9.8800049 9.8798828 4.8187256 9.1519775 6.534668 4.229248 8.0427246 3.8132324 9.8800049 9.8280029 9.8280029 8.631958"
           id="tspan1685">having fun. The watercolor technique gives him a soft, slightly textured look, as if the paint has just dried on the page, perfect for a sweet illustration in a toddler's book.</tspan></tspan></text><image
