         xml:space="preserve"
         style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:10.7795px;line-height:1.25;font-family:'Aceituna DEMO';-inkscape-font-specification:'Aceituna DEMO, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;letter-spacing:0px;word-spacing:0px;fill:#ffffff;fill-opacity:1;stroke:none;stroke-width:0;stroke-dasharray:none"
         x="68.736145"
         y="193.76625"
         id="text285-1-5"><tspan
           sodipodi:role="line"
           id="tspan522">and handed him a drawing.</tspan></text></g><text
       xml:space="preserve"
       transform="scale(0.26458333)"
       id="text4185"
       style="font-size:33.9077px;line-height:1.25;font-family:sans-serif;-inkscape-font-specification:'sans-serif, Normal';letter-spacing:0px;word-spacing:0px;white-space:pre;shape-inside:url(#rect4187);display:inline" /><text
       xml:space="preserve"
       transform="matrix(0.21666182,0,0,0.21666182,140.18801,-48.968108)"
       id="text4191"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:16.2824px;line-height:1.25;font-family:sans-serif;-inkscape-font-specification:'sans-serif, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;letter-spacing:0px;word-spacing:0px;white-space:pre;shape-inside:url(#rect4193);display:inline"><tspan
         x="-414.44922"
         y="-75.220204"
         id="tspan574">A young Tyrannosaurus Rex, just a toddler, rendered in a charming watercolor style (aquarelle painting </tspan><tspan
         x="-414.44922"
         y="-54.867208"
         id="tspan576">method). His primary color is a sunny yellow, the kind that makes you smile. He's been drawn with a slimmer, </tspan><tspan
         x="-414.44922"
         y="-34.514207"
         id="tspan578">more elongated body than you might typically imagine for a T-Rex, emphasizing his youthfulness. This makes </tspan><tspan
         x="-414.44922"
         y="-14.161206"
         id="tspan580">him appear a little taller and less bulky, enhancing his cute and approachable demeanor. His head is large and </tspan><tspan
         x="-414.44922"
         y="6.1917943"
         id="tspan582">round with big, endearing eyes that are a deep, captivating blue, complete with bright white highlights that </tspan><tspan
         x="-414.44922"
         y="26.544795"
         id="tspan584">make them sparkle. A gentle smile curves his mouth, revealing tiny, harmless teeth. His small arms, </tspan><tspan
         x="-414.44922"
         y="46.897796"
         id="tspan586">characteristic of a T-Rex, are held slightly away from his body, and his sturdy legs end in rounded, three-clawed </tspan><tspan
         x="-414.44922"
         y="67.250796"
         id="tspan588">feet. A row of soft, rounded spikes runs down his back and along his tail, painted in slightly muted shades of </tspan><tspan
         x="-414.44922"
         y="87.603801"
         id="tspan590">yellow and orange, adding to his gentle appearance. Present the young Tyrannosaurus Rex sitting in the corner </tspan><tspan
         x="-414.44922"
         y="107.9568"
         id="tspan592">of the room. A dinosaur friend comes near him and give him a drawing he made. He looks up to his colleague </tspan><tspan
         x="-414.44922"
         y="128.30979"
         id="tspan594">and feels cheerful and relief. The scene gets brighter and colors stars to appear back in his life. The watercolor </tspan><tspan
         x="-414.44922"
         y="148.66279"
         id="tspan596">technique gives him a soft, slightly textured look, as if the paint has just dried on the page, perfect for a sweet </tspan><tspan
         x="-414.44922"
         y="169.01579"
         id="tspan598">illustration in a toddler's book.</tspan></text></g></svg>
