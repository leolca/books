         x="69.036758"
         y="193.76625"
         id="text285"><tspan
           sodipodi:role="line"
           id="tspan518">Pipoca was still quietly sobbing in the corner...</tspan></text></g><g
       id="g1212-3"
       transform="matrix(1.2314472,0,0,1.2314472,-70.086247,-205.90134)"><rect
