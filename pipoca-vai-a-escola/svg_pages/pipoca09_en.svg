         x="69.036758"
         y="193.76625"
         id="text285-1"><tspan
           sodipodi:role="line"
           id="tspan520"
           x="69.036758"
           y="193.76625">Until Lila slowly came over without saying a word...</tspan></text></g><g
       id="g1212-3-6"
       transform="matrix(1.2279182,0,0,1.2279182,-57.536864,-189.10114)"><rect
