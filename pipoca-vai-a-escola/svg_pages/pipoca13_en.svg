         x="127.79297"
         y="205.94613"
         id="tspan1551">Every change begins with butterflies in your tummy.
</tspan><tspan
         x="127.79297"
         y="222.61275"
         id="tspan1553">And it's in that fluttering that courage is born.
</tspan><tspan
         x="127.79297"
         y="239.27938"
         id="tspan1555">You have to step out to discover...
</tspan><tspan
         x="127.79297"
         y="255.946"
         id="tspan1557">that we too have wings to soar into freedom.</tspan></text><g
       id="SVGRepo_bgCarrier"
       stroke-width="0"
       transform="matrix(0.26458333,0,0,0.26458333,86.865195,97.70787)" /><g
