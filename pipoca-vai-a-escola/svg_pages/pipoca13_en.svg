       xml:space="preserve"
       transform="scale(0.26458333)"
       id="text435"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:17.3333px;font-family:Cantarell;-inkscape-font-specification:'Cantarell, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;white-space:pre;shape-inside:url(#rect437);display:inline;fill:#803300" /><text
       xml:space="preserve"
       transform="matrix(0.26458333,0,0,0.26458333,19.202469,13.336724)"
       id="text441"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:17.3333px;font-family:Cantarell;-inkscape-font-specification:'Cantarell, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;white-space:pre;shape-inside:url(#rect443);display:inline;fill:#803300"><tspan
         x="-57.412109"
         y="-335.81339"
         id="tspan1559">A young Tyrannosaurus Rex, just a toddler, rendered in a charming watercolor style (aquarelle </tspan><tspan
         x="-57.412109"
         y="-314.14676"
         id="tspan1561">painting method). His primary color is a sunny yellow, the kind that makes you smile. He's been </tspan><tspan
         x="-57.412109"
         y="-292.48013"
         id="tspan1563">drawn with a slimmer, more elongated body than you might typically imagine for a T-Rex, </tspan><tspan
         x="-57.412109"
         y="-270.81351"
         id="tspan1565">emphasizing his youthfulness. This makes him appear a little taller and less bulky, enhancing his </tspan><tspan
         x="-57.412109"
         y="-249.14688"
         id="tspan1567">cute and approachable demeanor. His head is large and round with big, endearing eyes that are a </tspan><tspan
         x="-57.412109"
         y="-227.48026"
         id="tspan1569">deep, captivating blue, complete with bright white highlights that make them sparkle. A gentle </tspan><tspan
         x="-57.412109"
         y="-205.81363"
         id="tspan1571">smile curves his mouth, revealing tiny, harmless teeth. His small arms, characteristic of a T-Rex, </tspan><tspan
         x="-57.412109"
         y="-184.147"
         id="tspan1573">are held slightly away from his body, and his sturdy legs end in rounded, three-clawed feet. A row </tspan><tspan
         x="-57.412109"
         y="-162.48038"
         id="tspan1575">of soft, rounded spikes runs down his back and along his tail, painted in slightly muted shades of </tspan><tspan
         x="-57.412109"
         y="-140.81375"
         id="tspan1577">yellow and orange, adding to his gentle appearance. Present the young Tyrannosaurus Rex riding </tspan><tspan
         x="-57.412109"
         y="-119.14713"
         id="tspan1579">a bike with both feet up, he is wearing a blue bike helmet and he is having fun. Picture him in a </tspan><tspan
         x="-57.412109"
         y="-97.4805"
         id="tspan1581">blank white background (void).  The watercolor technique gives him a soft, slightly textured look, </tspan><tspan
         x="-57.412109"
         y="-75.813874"
         id="tspan1583">as if the paint has just dried on the page, perfect for a sweet illustration in a toddler's book.</tspan></text><image
