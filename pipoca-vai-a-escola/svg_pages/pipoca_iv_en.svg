         x="127.79297"
         y="205.94613"
         id="tspan469">Dear readers,
</tspan><tspan
         x="127.79297"
         y="222.61275"
         id="tspan471">
</tspan><tspan
         x="127.79297"
         y="239.27938"
         id="tspan473">This story was inspired by my daughter's adventure as she began school. It </tspan><tspan
         x="127.79297"
         y="255.946"
         id="tspan475">brings forth the fears, the anxieties, and the many joys of this very special </tspan><tspan
         x="127.79297"
         y="272.61263"
         id="tspan477">moment. May Popcorn's journey serve as a bridge to help children face </tspan><tspan
         x="127.79297"
         y="289.27926"
         id="tspan479">challenges and celebrate the joys of those first years at school.
</tspan><tspan
         x="127.79297"
         y="305.94588"
         id="tspan481">
</tspan><tspan
         x="127.79297"
         y="322.61251"
         id="tspan483">Each story is unique, but the essence and magic within them is always the </tspan><tspan
         x="127.79297"
         y="339.27913"
         id="tspan485">same.
</tspan><tspan
         x="127.79297"
         y="355.94576"
         id="tspan487">
</tspan><tspan
         x="127.79297"
         y="372.61239"
         id="tspan489">With affection,
</tspan><tspan
         x="127.79297"
         y="389.27901"
         id="tspan491">LEo</tspan></text><g
