         id="text301"
         style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:16px;font-family:Cantarell;-inkscape-font-specification:'Cantarell, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;white-space:pre;shape-inside:url(#rect303);display:inline;opacity:1;fill:#ffffff;fill-opacity:1;stroke-width:5.66929"><tspan
           x="79.835938"
           y="155.54203"
           id="tspan911">“Popcorn Goes to School” follows the delicate and </tspan><tspan
           x="79.835938"
           y="175.54203"
           id="tspan913">transformative journey of a little dinosaur on his very first day </tspan><tspan
           x="79.835938"
           y="195.54203"
           id="tspan915">of school. Between the butterflies in his tummy, the wish to </tspan><tspan
           x="79.835938"
           y="215.54203"
           id="tspan917">go back home, and a curiosity that insists on shining, Popcorn </tspan><tspan
           x="79.835938"
           y="235.54203"
           id="tspan919">discovers that school can be much more than an unfamiliar </tspan><tspan
           x="79.835938"
           y="255.54203"
           id="tspan921">place: it's where friendships, adventures, and learning are </tspan><tspan
           x="79.835938"
           y="275.54203"
           id="tspan923">born... and even a few tears. In the midst of disputes and </tspan><tspan
           x="79.835938"
           y="295.54203"
           id="tspan925">intense emotions, he realizes that the other can also be a </tspan><tspan
           x="79.835938"
           y="315.54203"
           id="tspan927">mirror — reflecting fears, desires, comfort, and discoveries </tspan><tspan
           x="79.835938"
           y="335.54203"
           id="tspan929">that belong to everyone. In this sensitive and playful story, </tspan><tspan
           x="79.835938"
           y="355.54203"
           id="tspan931">every emotion Popcorn feels mirrors what so many children </tspan><tspan
           x="79.835938"
           y="375.54203"
           id="tspan933">experience when taking their first steps away from the nest. </tspan><tspan
           x="79.835938"
           y="395.54203"
           id="tspan935">By the end of the day, school is no longer something to fear </tspan><tspan
           x="79.835938"
           y="415.54203"
           id="tspan937">— it becomes part of his heart.
</tspan></text></g></g></svg>
