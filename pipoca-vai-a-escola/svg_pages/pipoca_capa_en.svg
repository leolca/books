       transform="rotate(-10)"><tspan
         sodipodi:role="line"
         id="tspan325">School</tspan></text><text
       xml:space="preserve"
       transform="matrix(0.40672484,0,0,0.40672484,187.41022,118.767)"
       id="text240"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:17.3333px;line-height:1.25;font-family:Cantarell;-inkscape-font-specification:'Cantarell, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;letter-spacing:0px;word-spacing:0px;white-space:pre;shape-inside:url(#rect242);display:inline;fill:#ffffff"><tspan
         x="127.79297"
         y="209.53818"
         id="tspan909">Leonardo Araújo</tspan></text><g
       id="g972"
       transform="translate(-10.530329,20.828818)"><rect
         style="opacity:0.3;fill:#808080;fill-opacity:1;stroke-width:1.5"
