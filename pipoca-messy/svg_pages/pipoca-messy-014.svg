       height="260.35001"
       x="-3.5527137e-15"
       y="0" /><text
       xml:space="preserve"
       transform="matrix(0.65368358,0,0,0.65368358,-12.345657,15.257012)"
       id="text954-0"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:8.63483px;font-family:Tuffy;-inkscape-font-specification:'Tuffy, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;white-space:pre;shape-inside:url(#rect956-9);display:inline;fill:#ffffff;stroke:none"><tspan
         x="45.373047"
         y="186.32524"
         id="tspan6206">Na mitologia grega, Dédalo era um arquiteto brilhante, criador do </tspan><tspan
         x="45.373047"
         y="197.11877"
         id="tspan6208">famoso labirinto de Creta. Preso dentro de sua própria criação, ele </tspan><tspan
         x="45.373047"
         y="207.9123"
         id="tspan6210">constrói asas de penas e cera para escapar com seu filho, Ícaro. </tspan><tspan
         x="45.373047"
         y="218.70584"
         id="tspan6212">Dédalo representa a ordem, o conhecimento técnico, a sabedoria </tspan><tspan
         x="45.373047"
         y="229.49937"
         id="tspan6214">prática. Mas Ícaro, tomado pelo entusiasmo do voo, ignora os </tspan><tspan
         x="45.373047"
         y="240.2929"
         id="tspan6216">conselhos do pai, sobe alto demais... e o sol derrete suas asas.
</tspan><tspan
         x="45.373047"
         y="251.08644"
         id="tspan6218">
</tspan><tspan
         x="45.373047"
         y="261.87997"
         id="tspan6220">Essa história é uma parábola sobre o equilíbrio entre ordem e caos, </tspan><tspan
         x="45.373047"
         y="272.6735"
         id="tspan6222">liberdade e limite, criatividade e segurança.
</tspan><tspan
         x="45.373047"
         y="283.46705"
         id="tspan6224">
</tspan><tspan
         x="45.373047"
         y="294.2606"
         id="tspan6226">O labirinto, afinal, é uma construção engenhosa — planejada com </tspan><tspan
         x="45.373047"
         y="305.05415"
         id="tspan6228">ordem e precisão. Ainda assim, quem entra nele pode se perder e as </tspan><tspan
         x="45.373047"
         y="315.8477"
         id="tspan6230">coisas somem. Do mesmo modo, o quarto de uma criança pode </tspan><tspan
         x="45.373047"
         y="326.64125"
         id="tspan6232">parecer caótico, mas está cheio de sentido para quem o vive. E mesmo </tspan><tspan
         x="45.373047"
         y="337.43479"
         id="tspan6234">a arrumação, se rígida demais, pode virar um labirinto de regras, onde </tspan><tspan
         x="45.373047"
         y="348.22834"
         id="tspan6236">a criatividade se esconde ou se perde.</tspan></text><text
       xml:space="preserve"
       transform="matrix(0.65368358,0,0,0.65368358,202.12285,44.578949)"
       id="text954-0-5"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:8.63483px;font-family:Tuffy;-inkscape-font-specification:'Tuffy, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;white-space:pre;shape-inside:url(#rect956-9-7);display:inline;fill:#ffffff;stroke:none"><tspan
         x="45.373047"
         y="186.32524"
         id="tspan6238">É importante lembrar: a bagunça também tem seu lugar. O caos, na </tspan><tspan
         x="45.373047"
         y="197.11877"
         id="tspan6240">infância, é terreno fértil para invenções, narrativas e descobertas. </tspan><tspan
         x="45.373047"
         y="207.9123"
         id="tspan6242">Guardar os brinquedos é um gesto de cuidado — não de repressão. </tspan><tspan
         x="45.373047"
         y="218.70584"
         id="tspan6244">Organizar é preparar o espaço para voar melhor, e não cortar as asas </tspan><tspan
         x="45.373047"
         y="229.49937"
         id="tspan6246">(ou a capa).
</tspan><tspan
         x="45.373047"
         y="240.2929"
         id="tspan6248">
</tspan><tspan
         x="45.373047"
         y="251.08644"
         id="tspan6250">A proposta deste livro não é ensinar regras rígidas, mas celebrar o </tspan><tspan
         x="45.373047"
         y="261.87997"
         id="tspan6252">equilíbrio delicado entre a liberdade criativa da infância e o cultivo de </tspan><tspan
         x="45.373047"
         y="272.6735"
         id="tspan6254">pequenas responsabilidades.
</tspan><tspan
         x="45.373047"
         y="283.46705"
         id="tspan6256">
</tspan><tspan
         x="45.373047"
         y="294.2606"
         id="tspan6258">Crescer, afinal, é aprender a voar... sem esquecer que não se deve </tspan><tspan
         x="45.373047"
         y="305.05415"
         id="tspan6260">voar alto demais.</tspan></text></g></svg>
