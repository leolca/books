         x="127.79297"
         y="207.53883"
         id="tspan362">Popcorn in the Tidying Labyrinth
</tspan><tspan
         x="127.79297"
         y="226.70546"
         id="tspan364">
</tspan><tspan
         x="127.79297"
         y="245.87209"
         id="tspan366">Toy cars, modeling clay, scattered socks, books everywhere...
</tspan><tspan
         x="127.79297"
         y="265.03871"
         id="tspan368">The chaos that fuels creativity can also consume —
</tspan><tspan
         x="127.79297"
         y="284.20534"
         id="tspan370">and trap you in a labyrinth.
</tspan><tspan
         x="127.79297"
         y="303.37196"
         id="tspan372">
</tspan><tspan
         x="127.79297"
         y="322.53859"
         id="tspan374">Things go missing, monsters appear —
</tspan><tspan
         x="127.79297"
         y="341.70522"
         id="tspan376">and even the superhero loses his cape!
</tspan><tspan
         x="127.79297"
         y="360.87184"
         id="tspan378">
</tspan><tspan
         x="127.79297"
         y="380.03847"
         id="tspan380">In this story, we follow Pipoca as he discovers
</tspan><tspan
         x="127.79297"
         y="399.20509"
         id="tspan382">that tidying up isn’t punishment,
</tspan><tspan
         x="127.79297"
         y="418.37172"
         id="tspan384">but a way to prepare for even greater flights.
</tspan><tspan
         x="127.79297"
         y="437.53834"
         id="tspan386">
</tspan><tspan
         x="127.79297"
         y="456.70497"
         id="tspan388">Because growing up also means learning to organize the world —
</tspan><tspan
         x="127.79297"
         y="475.8716"
         id="tspan390">inside and out —
</tspan><tspan
         x="127.79297"
         y="495.03822"
         id="tspan392">without ever giving up on dreaming and flying.
</tspan><tspan
         x="127.79297"
         y="514.20485"
         id="tspan394">But not too high... so you don’t get burned.</tspan></text><image
       width="180.02271"
       height="120.01513"
       preserveAspectRatio="none"
       xlink:href="../imagens/pipoca-messy-016.png"
