       height="260.35001"
       x="-3.5527137e-15"
       y="0" /><text
       xml:space="preserve"
       transform="matrix(0.65368358,0,0,0.65368358,-12.345657,15.257012)"
       id="text954-0"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:8.63483px;font-family:Tuffy;-inkscape-font-specification:'Tuffy, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;white-space:pre;shape-inside:url(#rect956-9);display:inline;fill:#ffffff;stroke:none"><tspan
         x="45.373047"
         y="186.32524"
         id="tspan421">In Greek mythology, Daedalus was a brilliant architect, the creator of </tspan><tspan
         x="45.373047"
         y="197.11877"
         id="tspan423">the famous labyrinth of Crete. Trapped inside his own creation, he </tspan><tspan
         x="45.373047"
         y="207.9123"
         id="tspan425">built wings of feathers and wax to escape with his son, Icarus. </tspan><tspan
         x="45.373047"
         y="218.70584"
         id="tspan427">Daedalus represents order, technical knowledge, and practical wisdom. </tspan><tspan
         x="45.373047"
         y="229.49937"
         id="tspan429">But Icarus, thrilled by the flight, ignored his father's advice, flew too </tspan><tspan
         x="45.373047"
         y="240.2929"
         id="tspan431">high... and the sun melted his wings.
</tspan><tspan
         x="45.373047"
         y="251.08644"
         id="tspan433">
</tspan><tspan
         x="45.373047"
         y="261.87997"
         id="tspan435">This story is a parable about the balance between order and chaos, </tspan><tspan
         x="45.373047"
         y="272.6735"
         id="tspan437">freedom and limits, creativity and safety.
</tspan><tspan
         x="45.373047"
         y="283.46705"
         id="tspan439">
</tspan><tspan
         x="45.373047"
         y="294.2606"
         id="tspan441">The labyrinth, after all, is an ingenious construction — planned with </tspan><tspan
         x="45.373047"
         y="305.05415"
         id="tspan443">order and precision. Yet those who enter it can become lost, and </tspan><tspan
         x="45.373047"
         y="315.8477"
         id="tspan445">things disappear. In the same way, a child's room may seem chaotic, </tspan><tspan
         x="45.373047"
         y="326.64125"
         id="tspan447">but it's full of meaning for the one who lives there. And even tidying </tspan><tspan
         x="45.373047"
         y="337.43479"
         id="tspan449">up, if too rigid, can become a maze of rules where creativity hides or </tspan><tspan
         x="45.373047"
         y="348.22834"
         id="tspan451">gets lost.</tspan></text><text
       xml:space="preserve"
       transform="matrix(0.65368358,0,0,0.65368358,202.12285,44.578949)"
       id="text954-0-5"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:8.63483px;font-family:Tuffy;-inkscape-font-specification:'Tuffy, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;white-space:pre;shape-inside:url(#rect956-9-7);display:inline;fill:#ffffff;stroke:none"><tspan
         x="45.373047"
         y="186.32524"
         id="tspan453">It's important to remember: messes have their place too. Chaos, in </tspan><tspan
         x="45.373047"
         y="197.11877"
         id="tspan455">childhood, is fertile ground for invention, stories, and discovery. </tspan><tspan
         x="45.373047"
         y="207.9123"
         id="tspan457">Putting away toys is a gesture of care — not repression. Organizing is </tspan><tspan
         x="45.373047"
         y="218.70584"
         id="tspan459">preparing the space to fly better, not clipping wings (or capes).
</tspan><tspan
         x="45.373047"
         y="229.49937"
         id="tspan461">
</tspan><tspan
         x="45.373047"
         y="240.2929"
         id="tspan463">The aim of this book isn’t to teach rigid rules, but to celebrate the </tspan><tspan
         x="45.373047"
         y="251.08644"
         id="tspan465">delicate balance between the creative freedom of childhood and the </tspan><tspan
         x="45.373047"
         y="261.87997"
         id="tspan467">gentle cultivation of responsibility.
</tspan><tspan
         x="45.373047"
         y="272.6735"
         id="tspan469">
</tspan><tspan
         x="45.373047"
         y="283.46705"
         id="tspan471">Because growing up is, after all, learning how to fly... without </tspan><tspan
         x="45.373047"
         y="294.2606"
         id="tspan473">forgetting not to go too high.</tspan></text></g></svg>
