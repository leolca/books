         x="127.79297"
         y="207.53883"
         id="tspan404">Pipoca, como toda criança, vive entre o caos e o cuidado, entre a imaginação </tspan><tspan
         x="127.79297"
         y="226.70546"
         id="tspan406">fértil e os limites das gavetas.
</tspan><tspan
         x="127.79297"
         y="245.87209"
         id="tspan408">
</tspan><tspan
         x="127.79297"
         y="265.03871"
         id="tspan410">Ler esta história junto com uma criança é mergulhar nesse universo onde, entre </tspan><tspan
         x="127.79297"
         y="284.20534"
         id="tspan412">sumiços, sustos e bagunça, descobrimos o valor do cuidado — e a beleza da </tspan><tspan
         x="127.79297"
         y="303.37196"
         id="tspan414">organização que nasce sem perder a fantasia.
</tspan><tspan
         x="127.79297"
         y="322.53859"
         id="tspan416">
</tspan><tspan
         x="127.79297"
         y="341.70522"
         id="tspan418">Que este livro seja uma oportunidade de criar memórias, de rir, conversar e voar </tspan><tspan
         x="127.79297"
         y="360.87184"
         id="tspan420">juntos com alegria e afeto, encontrando, página a página, o delicado equilíbrio </tspan><tspan
         x="127.79297"
         y="380.03847"
         id="tspan422">entre a ordem e a desordem.</tspan></text><image
       width="125.05225"
       height="83.368164"
       preserveAspectRatio="none"
       xlink:href="../imagens/pipoca-bike.png"
