       id="text240"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:15.3333px;line-height:1.25;font-family:Tuffy;-inkscape-font-specification:'Tuffy, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;letter-spacing:0px;word-spacing:0px;white-space:pre;shape-inside:url(#rect242);display:inline;fill:#ffffff"><tspan
         x="127.79297"
         y="207.53883"
         id="tspan403">Refusing to go to school is, for many children, a natural step in their path </tspan><tspan
         x="127.79297"
         y="226.70546"
         id="tspan405">toward growth. This refusal often comes in disguise — with traces of truth, </tspan><tspan
         x="127.79297"
         y="245.87209"
         id="tspan407">seasoned by imagination. It’s important to listen to what the child has to say </tspan><tspan
         x="127.79297"
         y="265.03871"
         id="tspan409">and understand that, unable to fully express their feelings, they turn to the </tspan><tspan
         x="127.79297"
         y="284.20534"
         id="tspan411">justifications that come first to mind.
</tspan><tspan
         x="127.79297"
         y="303.37196"
         id="tspan413">
</tspan><tspan
         x="127.79297"
         y="322.53859"
         id="tspan415">In this book, we follow Popcorn on his journey of reluctance and discovery. Each </tspan><tspan
         x="127.79297"
         y="341.70522"
         id="tspan417">day, his creative mind invents a new excuse to avoid going to school. And each </tspan><tspan
         x="127.79297"
         y="360.87184"
         id="tspan419">day, reality shows that school can be fun and welcoming — and that while his </tspan><tspan
         x="127.79297"
         y="380.03847"
         id="tspan421">excuses may seem true to him, they are often woven with fantasy.
</tspan><tspan
         x="127.79297"
         y="399.20509"
         id="tspan423">
</tspan><tspan
         x="127.79297"
         y="418.37172"
         id="tspan425">A child’s imagination is powerful — and sometimes, it serves as a shield. With </tspan><tspan
         x="127.79297"
         y="437.53834"
         id="tspan427">lightness and humor, this story invites adults and little ones to face this </tspan><tspan
         x="127.79297"
         y="456.70497"
         id="tspan429">moment of transition with empathy, listening, and care.
</tspan><tspan
         x="127.79297"
         y="475.8716"
         id="tspan431">
</tspan><tspan
         x="127.79297"
         y="495.03822"
         id="tspan433">Because, in the end, the hardest part isn’t arriving at school… it’s wanting to </tspan><tspan
         x="127.79297"
         y="514.20485"
         id="tspan435">leave.</tspan></text><text
       xml:space="preserve"
       transform="scale(0.26458333)"
       id="text1234"
