       id="text240"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:15.3333px;line-height:1.25;font-family:Tuffy;-inkscape-font-specification:'Tuffy, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;letter-spacing:0px;word-spacing:0px;white-space:pre;shape-inside:url(#rect242);display:inline;fill:#ffffff"><tspan
         x="127.79297"
         y="207.53883"
         id="tspan346">Recusar-se a ir à escola é, para muitas crianças, uma etapa natural no caminho </tspan><tspan
         x="127.79297"
         y="226.70546"
         id="tspan348">do crescimento. Essa recusa muitas vezes vem disfarçada — com toques de </tspan><tspan
         x="127.79297"
         y="245.87209"
         id="tspan350">realidade, temperada pela imaginação. É importante ouvir o que a criança tem a </tspan><tspan
         x="127.79297"
         y="265.03871"
         id="tspan352">dizer e compreender que, por ainda não saber expressar plenamente seus </tspan><tspan
         x="127.79297"
         y="284.20534"
         id="tspan354">sentimentos, ela recorre às justificativas que primeiro lhe vêm à mente.
</tspan><tspan
         x="127.79297"
         y="303.37196"
         id="tspan356">
</tspan><tspan
         x="127.79297"
         y="322.53859"
         id="tspan358">Neste livro, acompanhamos Pipoca em sua jornada de relutância e descoberta. A </tspan><tspan
         x="127.79297"
         y="341.70522"
         id="tspan360">cada dia, sua mente criativa inventa uma nova desculpa para não ir à escola. E, </tspan><tspan
         x="127.79297"
         y="360.87184"
         id="tspan362">a cada dia, a realidade mostra que a escola pode ser divertida e acolhedora — e </tspan><tspan
         x="127.79297"
         y="380.03847"
         id="tspan364">que, embora suas desculpas possam parecer verdadeiras para ele, muitas vezes </tspan><tspan
         x="127.79297"
         y="399.20509"
         id="tspan366">estão misturadas a fantasias.
</tspan><tspan
         x="127.79297"
         y="418.37172"
         id="tspan368">
</tspan><tspan
         x="127.79297"
         y="437.53834"
         id="tspan370">A imaginação das crianças é poderosa — e, às vezes, também serve de escudo. </tspan><tspan
         x="127.79297"
         y="456.70497"
         id="tspan372">Com leveza e humor, esta história convida adultos e pequenos a olharem juntos </tspan><tspan
         x="127.79297"
         y="475.8716"
         id="tspan374">para esse momento de transição com empatia, escuta e afeto.
</tspan><tspan
         x="127.79297"
         y="495.03822"
         id="tspan376">
</tspan><tspan
         x="127.79297"
         y="514.20485"
         id="tspan378">Porque, no fim das contas, o mais difícil não é chegar à escola… é querer ir </tspan><tspan
         x="127.79297"
         y="533.37147"
         id="tspan380">embora.</tspan></text><text
       xml:space="preserve"
       transform="scale(0.26458333)"
       id="text1234"
